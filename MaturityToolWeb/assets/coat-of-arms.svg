<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Simplified South African Coat of Arms -->
  <!-- Circle background -->
  <circle cx="50" cy="50" r="48" fill="#FFB81C"/>
  <circle cx="50" cy="50" r="44" fill="#003366"/>
  
  <!-- Central shield -->
  <path d="M50 20 L70 35 V55 C70 70 50 78 50 78 C50 78 30 70 30 55 V35 L50 20Z" fill="#FFB81C"/>
  
  <!-- Spear and GNU symbol in center -->
  <path d="M50 25 L50 75" stroke="#003366" stroke-width="3"/>
  <path d="M40 45 L50 55 L60 45" stroke="#003366" stroke-width="2" fill="none"/>
  <path d="M50 35 L50 50" stroke="#003366" stroke-width="2"/>
  
  <!-- decorative elements -->
  <circle cx="50" cy="22" r="4" fill="#FFB81C"/>
  <circle cx="50" cy="76" r="4" fill="#FFB81C"/>
  
  <!-- Outer ring text area (simplified) -->
  <circle cx="50" cy="50" r="48" stroke="#FFB81C" stroke-width="2" fill="none"/>
</svg>
